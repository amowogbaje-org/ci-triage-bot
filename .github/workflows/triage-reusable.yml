name: CI Triage Bot (reusable)

# This is the actual product: a reusable workflow other repos call into.
# It is NOT triggered directly — nothing in this repo (or any caller repo)
# should list "CI Triage Bot (reusable)" under `workflows:`. Instead, each
# consuming repo has its own tiny workflow with a `workflow_run` trigger
# that calls this one via `uses:`. See triage-demo-caller.yml in this repo
# for the local example, and README.md -> "Using this in another repo" for
# the cross-repo version.

on:
  workflow_call:
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true
      GROQ_API_KEY:
        required: true
      GH_APP_INSTALLATION_ID:
        required: false

jobs:
  triage:
    # Comments on both success and failure; python itself also guards this,
    # but filtering here avoids spinning up a runner for cancelled/skipped/etc.
    if: contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      # Always pull scripts/ from THIS repo, even when a different repo is
      # the caller — the calling repo never needs its own copy of the code.
      - name: Checkout triage bot source
        uses: actions/checkout@v4
        with:
          repository: amowogbaje/ci-triage-bot
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run triage
        working-directory: scripts
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python triage.py
